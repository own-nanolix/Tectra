<svg viewBox="0 0 560 360" data-export="typography-habit-open-quote" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Habit: quotes open with a straight double quote and have no closing quote" style="color:rgb(47, 47, 47);fill:rgb(0, 0, 0);stroke:none;stroke-width:1px;" xmlns:xlink="http://www.w3.org/1999/xlink" width="560" height="360"><title>Habit: quotes open with a straight double quote and have no closing quote</title><rect width="560" height="360" rx="6" fill="#F5F5F5" style="color:rgb(47, 47, 47);fill:rgb(245, 245, 245);stroke:none;stroke-width:1px;"/><text x="40" y="150" font-size="38" font-weight="300" fill="#2F2F2F" style="color:rgb(47, 47, 47);fill:rgb(47, 47, 47);stroke:none;stroke-width:1px;font-family:Urbanist, 'Helvetica Neue', Arial, system-ui, sans-serif;font-size:38px;font-weight:300;">"Real-time updates were</text><text x="40" y="200" font-size="38" font-weight="300" fill="#2F2F2F" style="color:rgb(47, 47, 47);fill:rgb(47, 47, 47);stroke:none;stroke-width:1px;font-family:Urbanist, 'Helvetica Neue', Arial, system-ui, sans-serif;font-size:38px;font-weight:300;">missing. We</text><rect x="35" y="114" width="18" height="44" rx="2" fill="none" stroke="#4093EC" stroke-width="1.5" stroke-dasharray="4 4" style="color:rgb(47, 47, 47);fill:none;stroke:rgb(64, 147, 236);stroke-width:1.5px;stroke-dasharray:4px, 4px;"/><g style="color:rgb(47, 47, 47);fill:rgb(0, 0, 0);stroke:none;stroke-width:1px;"><path d="M44 112L78 69" stroke="#145CB8" stroke-width="1" fill="none" style="color:rgb(47, 47, 47);fill:none;stroke:rgb(20, 92, 184);stroke-width:1px;"/><circle cx="44" cy="112" r="3.5" fill="#145CB8" style="color:rgb(47, 47, 47);fill:rgb(20, 92, 184);stroke:none;stroke-width:1px;"/><text x="84" y="74" font-size="15" font-weight="500" fill="#145CB8" style="color:rgb(47, 47, 47);fill:rgb(20, 92, 184);stroke:none;stroke-width:1px;font-family:Urbanist, 'Helvetica Neue', Arial, system-ui, sans-serif;font-size:15px;font-weight:500;">Straight quote, no closing mark</text></g></svg>