<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 560 360" data-export="typography-habit-case" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Habit: sentence case for body and cards, Title Case for section headings, upper case only for footer heads" style="color:rgb(47, 47, 47);fill:rgb(0, 0, 0);stroke:none;stroke-width:1px;" xmlns:xlink="http://www.w3.org/1999/xlink" width="560" height="360"><title>Habit: sentence case for body and cards, Title Case for section headings, upper case only for footer heads</title><rect width="560" height="360" rx="6" fill="#F5F5F5" style="color:rgb(47, 47, 47);fill:rgb(245, 245, 245);stroke:none;stroke-width:1px;"/><g style="color:rgb(47, 47, 47);fill:rgb(0, 0, 0);stroke:none;stroke-width:1px;"><text x="40" y="84" font-size="20" font-weight="300" fill="#2F2F2F" letter-spacing="0" style="color:rgb(47, 47, 47);fill:rgb(47, 47, 47);stroke:none;stroke-width:1px;font-family:Urbanist, 'Helvetica Neue', Arial, system-ui, sans-serif;font-size:20px;font-weight:300;">Overcoming Key Obstacles in Project Management</text><text x="40" y="114" font-size="14" font-weight="500" fill="#145CB8" style="color:rgb(47, 47, 47);fill:rgb(20, 92, 184);stroke:none;stroke-width:1px;font-family:Urbanist, 'Helvetica Neue', Arial, system-ui, sans-serif;font-size:14px;font-weight:500;">Title Case: section headings</text><line x1="40" x2="520" y1="138" y2="138" stroke="#DDDDDD" style="color:rgb(47, 47, 47);fill:rgb(0, 0, 0);stroke:rgb(221, 221, 221);stroke-width:1px;"/></g><g style="color:rgb(47, 47, 47);fill:rgb(0, 0, 0);stroke:none;stroke-width:1px;"><text x="40" y="184" font-size="22" font-weight="300" fill="#2F2F2F" letter-spacing="0" style="color:rgb(47, 47, 47);fill:rgb(47, 47, 47);stroke:none;stroke-width:1px;font-family:Urbanist, 'Helvetica Neue', Arial, system-ui, sans-serif;font-size:22px;font-weight:300;">Fragmented data, slow task flow</text><text x="40" y="214" font-size="14" font-weight="500" fill="#145CB8" style="color:rgb(47, 47, 47);fill:rgb(20, 92, 184);stroke:none;stroke-width:1px;font-family:Urbanist, 'Helvetica Neue', Arial, system-ui, sans-serif;font-size:14px;font-weight:500;">Sentence case: body and cards</text><line x1="40" x2="520" y1="238" y2="238" stroke="#DDDDDD" style="color:rgb(47, 47, 47);fill:rgb(0, 0, 0);stroke:rgb(221, 221, 221);stroke-width:1px;"/></g><g style="color:rgb(47, 47, 47);fill:rgb(0, 0, 0);stroke:none;stroke-width:1px;"><text x="40" y="284" font-size="13" font-weight="500" fill="#2F2F2F" letter-spacing="0.5" style="color:rgb(47, 47, 47);fill:rgb(47, 47, 47);stroke:none;stroke-width:1px;font-family:Urbanist, 'Helvetica Neue', Arial, system-ui, sans-serif;font-size:13px;font-weight:500;letter-spacing:0.5px;">RESOURCES</text><text x="40" y="314" font-size="14" font-weight="500" fill="#145CB8" style="color:rgb(47, 47, 47);fill:rgb(20, 92, 184);stroke:none;stroke-width:1px;font-family:Urbanist, 'Helvetica Neue', Arial, system-ui, sans-serif;font-size:14px;font-weight:500;">Upper case: footer column heads only</text></g></svg>